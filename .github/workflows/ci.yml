name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . build twine
      - run: python -m unittest discover -s tests
      - run: netbrain-auditor --version
      - run: netbrain-auditor --help
      - run: netbrain-auditor --from-json examples/devices.json --software-policy examples/approved_versions.yaml -o Demo
      - run: python -m build
      - run: python -m twine check dist/*
