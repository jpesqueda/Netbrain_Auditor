[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbrain-auditor"
version = "1.0.0"
description = "Read-only NetBrain inventory and data quality auditor"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Peskicorp"}]
dependencies = ["rich>=13", "PyYAML>=6"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: System :: Networking", "Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/jpesqueda/Netbrain_Auditor"
Issues = "https://github.com/jpesqueda/Netbrain_Auditor/issues"

[project.scripts]
netbrain-auditor = "netbrain_auditor.cli:main"
netbrainauditor = "netbrain_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
